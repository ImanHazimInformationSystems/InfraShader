<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1100" viewBox="0 0 1560 1100" role="img" aria-labelledby="title desc">
<title id="title">Local deployment and trust boundaries</title><desc id="desc">Configured development topology on one Windows PC. Port labels are configuration, not a live-service health claim.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#24705e"/></marker></defs>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#173b35}.title{font-size:35px;font-weight:700}.sub{font-size:18px;fill:#536c65}.head{font-size:23px;font-weight:650}.body{font-size:18px}.small{font-size:16px;fill:#536c65}.tag{font-size:15px;font-weight:700;letter-spacing:1px;fill:#24705e}</style>
<rect width="1560" height="1100" fill="#f5f8f5"/>
<text class="tag" x="40" y="38">INFRASHADER / ARCHITECTURE REVIEW / 21 OCTOBER 2026</text>
<text class="title" x="40" y="84">Local deployment and trust boundaries</text>
<text class="sub" x="40" y="117">Configured development topology on one Windows PC. Port labels are configuration, not a live-service health claim.</text>
<rect x="40" y="160" width="430" height="160" rx="14" fill="#ffffff" stroke="#c9d8d2"/>
<text class="tag" x="62" y="190">CLIENT EXECUTION</text>
<text class="head" x="62" y="223">User browser</text>
<text class="body" x="62" y="255">React application executes here</text>
<text class="body" x="62" y="282">Direct Auth + public map requests</text>
<text class="body" x="62" y="309">No business SQL or Storage secret</text>
<rect x="580" y="160" width="460" height="160" rx="14" fill="#ffffff" stroke="#c9d8d2"/>
<text class="tag" x="602" y="190">WINDOWS HOST</text>
<text class="head" x="602" y="223">Vite development server</text>
<text class="body" x="602" y="255">127.0.0.1:5173 - serves frontend assets</text>
<text class="body" x="602" y="282">/api dev proxy to FastAPI when used</text>
<text class="body" x="602" y="309">Production hosting is not deployed</text>
<polyline points="470,225 580,225" fill="none" stroke="#24705e" stroke-width="2.4" marker-end="url(#arrow)"/>
<text class="small" x="492" y="212">Assets</text>
<rect x="580" y="405" width="460" height="185" rx="14" fill="#ffffff" stroke="#c9d8d2"/>
<text class="tag" x="602" y="435">WINDOWS HOST</text>
<text class="head" x="602" y="468">FastAPI / Uvicorn</text>
<text class="body" x="602" y="500">127.0.0.1:8000 - Python 3.12</text>
<text class="body" x="602" y="527">Application + domain + adapters</text>
<text class="body" x="602" y="554">JWT and project permissions</text>
<text class="body" x="602" y="581">Calculations execute in API requests</text>
<polyline points="255,320 255,470 580,470" fill="none" stroke="#24705e" stroke-width="2.4" marker-end="url(#arrow)"/>
<text class="small" x="65" y="365">Protected API + public Explore requests</text>
<polyline points="810,320 810,405" fill="none" stroke="#24705e" stroke-width="2.4" marker-end="url(#arrow)"/>
<text class="small" x="830" y="365">Optional /api proxy</text>
<rect x="580" y="720" width="460" height="185" rx="14" fill="#ffffff" stroke="#c9d8d2"/>
<text class="tag" x="602" y="750">WINDOWS HOST / LOCAL DATABASE</text>
<text class="head" x="602" y="783">Application PostgreSQL / PostGIS</text>
<text class="body" x="602" y="815">127.0.0.1:54322 - business database</text>
<text class="body" x="602" y="842">Memberships, projects, revisions, artifacts</text>
<text class="body" x="602" y="869">Evidence metadata; separate test database</text>
<text class="body" x="602" y="896">Alembic 0001-0011</text>
<polyline points="810,590 810,720" fill="none" stroke="#24705e" stroke-width="2.4" marker-end="url(#arrow)"/>
<text class="small" x="830" y="659">Psycopg / SQL</text>
<rect x="1090" y="145" width="440" height="800" rx="18" fill="#edf3fa" stroke="#aac1d6"/>
<text class="tag" x="1110" y="180">DOCKER DESKTOP / WSL 2 LINUX</text>
<rect x="1110" y="220" width="400" height="150" rx="14" fill="#ffffff" stroke="#c9d8d2"/>
<text class="head" x="1132" y="250">Supabase gateway :54331</text>
<text class="body" x="1132" y="282">Auth endpoints + trusted JWKS</text>
<text class="body" x="1132" y="309">Private Storage API / evidence bucket</text>
<text class="body" x="1132" y="336">Not the application business API</text>
<rect x="1110" y="415" width="400" height="145" rx="14" fill="#ffffff" stroke="#c9d8d2"/>
<text class="head" x="1132" y="445">Supabase internal database</text>
<text class="body" x="1132" y="477">127.0.0.1:54332</text>
<text class="body" x="1132" y="504">Auth / Storage service state</text>
<text class="body" x="1132" y="531">Separate from app DB :54322</text>
<polyline points="1310,370 1310,415" fill="none" stroke="#24705e" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="1110" y="615" width="400" height="145" rx="14" fill="#ffffff" stroke="#c9d8d2"/>
<text class="head" x="1132" y="645">Private file persistence</text>
<text class="body" x="1132" y="677">Supabase-managed local file storage</text>
<text class="body" x="1132" y="704">Photo bytes, accessed through API</text>
<text class="body" x="1132" y="731">Not a retained-PDF archive</text>
<polyline points="1510,300 1520,300 1520,680 1510,680" fill="none" stroke="#24705e" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="1110" y="800" width="400" height="120" rx="14" fill="#ffffff" stroke="#c9d8d2"/>
<text class="head" x="1132" y="830">Local operator tools</text>
<text class="body" x="1132" y="862">Studio :54333; local mail UI :54334</text>
<text class="body" x="1132" y="889">Development / recovery tools only</text>
<polyline points="1040,460 1070,460 1070,295 1110,295" fill="none" stroke="#24705e" stroke-width="2.4" marker-end="url(#arrow)"/>
<text class="small" x="940" y="390">Auth / files</text>
<polyline points="255,160 255,137 1540,137 1540,255 1510,255" fill="none" stroke="#24705e" stroke-width="2.4" marker-end="url(#arrow)"/>
<text class="small" x="560" y="133">Browser Auth client</text>
<rect x="40" y="720" width="430" height="185" rx="14" fill="#fff3e4" stroke="#c9d8d2"/>
<text class="head" x="62" y="750">External public services</text>
<text class="body" x="62" y="782">OpenFreeMap and Photon via HTTPS</text>
<text class="body" x="62" y="809">Requested directly by the browser</text>
<text class="body" x="62" y="836">Offline coordinate fallback exists</text>
<text class="body" x="62" y="863">No paid provider or cloud deployment</text>
<polyline points="160,320 160,720" fill="none" stroke="#24705e" stroke-width="2.4" marker-end="url(#arrow)"/>
<text class="small" x="55" y="650">Map / search</text>
<text class="small" x="40" y="1000">Core tiers: browser presentation / Python application / persistent data. Supporting Auth and file services have their own runtime.</text>
<text class="small" x="40" y="1030">Local HTTP is loopback development traffic. A future hosted design requires explicit TLS, ingress, secrets and operational planning.</text>
</svg>