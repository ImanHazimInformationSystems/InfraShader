<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1290" viewBox="0 0 1560 1290" role="img" aria-labelledby="title desc">
<title id="title">Layered N-tier architecture</title><desc id="desc">AS BUILT: three core runtime tiers, five logical responsibility layers, plus supporting services.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#24705e"/></marker></defs>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#173b35}.title{font-size:35px;font-weight:700}.sub{font-size:18px;fill:#536c65}.head{font-size:23px;font-weight:650}.body{font-size:18px}.small{font-size:16px;fill:#536c65}.tag{font-size:15px;font-weight:700;letter-spacing:1px;fill:#24705e}</style>
<rect width="1560" height="1290" fill="#f5f8f5"/>
<text class="tag" x="40" y="38">INFRASHADER / ARCHITECTURE REVIEW / 21 OCTOBER 2026</text>
<text class="title" x="40" y="84">Layered N-tier architecture</text>
<text class="sub" x="40" y="117">AS BUILT: three core runtime tiers, five logical responsibility layers, plus supporting services.</text>
<rect x="40" y="155" width="1050" height="165" rx="14" fill="#ffffff" stroke="#c9d8d2"/>
<text class="tag" x="62" y="185">TIER 1  |  USER BROWSER</text>
<text class="head" x="62" y="218">L1  Presentation and client adapters</text>
<text class="body" x="62" y="250">React / TypeScript / React Router / Zod - Design Studio and Organisation Review</text>
<text class="body" x="62" y="277">MapLibre + Terra Draw + WebGL2 weather; API client; Supabase session client</text>
<text class="body" x="62" y="304">Browser PDF rendering from issued snapshots; separate Demo and scoped draft recovery</text>
<rect x="28" y="368" width="1074" height="552" rx="18" fill="#e9f1ee" stroke="#9dbbad" stroke-dasharray="8 5"/>
<polyline points="565,320 565,385" fill="none" stroke="#24705e" stroke-width="2.4" marker-end="url(#arrow)"/>
<text class="small" x="590" y="355">JSON / bearer JWT; multipart photos; responses return to browser</text>
<rect x="40" y="385" width="1050" height="125" rx="14" fill="#ffffff" stroke="#c9d8d2"/>
<text class="head" x="62" y="415">L2  API and request boundary</text>
<text class="body" x="62" y="447">FastAPI / Uvicorn - /api/v1, Pydantic contracts, CORS, body limits, errors and request IDs</text>
<text class="body" x="62" y="474">JWT verification at protected entry points; public bounded Explore endpoints are an exception</text>
<text class="tag" x="55" y="360">TIER 2  |  ONE PYTHON API PROCESS</text>
<polyline points="565,510 565,550" fill="none" stroke="#24705e" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="40" y="550" width="630" height="180" rx="14" fill="#ffffff" stroke="#c9d8d2"/>
<text class="head" x="62" y="580">L3  Application workflows</text>
<text class="body" x="62" y="612">Projects, workspace revisions, catalogue, estimates, reviews</text>
<text class="body" x="62" y="639">Organisation onboarding, invitations, project grants</text>
<text class="body" x="62" y="666">Evidence lifecycle and audience-filtered issue snapshots</text>
<text class="body" x="62" y="693">Active membership + capabilities + project access</text>
<rect x="690" y="550" width="400" height="180" rx="14" fill="#ffffff" stroke="#c9d8d2"/>
<text class="head" x="712" y="580">L3  Domain calculations</text>
<text class="body" x="712" y="612">Geometry: Shapely / PyProj</text>
<text class="body" x="712" y="639">Solar and flat-ground shade: pvlib</text>
<text class="body" x="712" y="666">Pricing and rounding: Decimal</text>
<text class="body" x="712" y="693">Authoritative server computations</text>
<polyline points="670,640 690,640" fill="none" stroke="#24705e" stroke-width="2.4" marker-end="url(#arrow)"/>
<polyline points="565,730 565,770" fill="none" stroke="#24705e" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="40" y="770" width="1050" height="125" rx="14" fill="#ffffff" stroke="#c9d8d2"/>
<text class="head" x="62" y="800">L4  Persistence and integration adapters</text>
<text class="body" x="62" y="832">SQLAlchemy sessions / ORM + Psycopg; transaction locks and compare-and-swap revisions</text>
<text class="body" x="62" y="859">HTTPX private Storage proxy + Pillow sanitisation; JWKS/current-account Auth integration</text>
<polyline points="565,895 565,980" fill="none" stroke="#24705e" stroke-width="2.4" marker-end="url(#arrow)"/>
<text class="small" x="590" y="949">SQL to application DB / server-authorised HTTP to private Storage</text>
<rect x="40" y="980" width="1050" height="180" rx="14" fill="#ffffff" stroke="#c9d8d2"/>
<text class="tag" x="62" y="1010">TIER 3  |  DATA AND FILE SERVICES</text>
<text class="head" x="62" y="1043">L5  Persistent application data and private files</text>
<text class="body" x="62" y="1075">PostgreSQL / PostGIS: business records, JSONB geometry, indexed WGS84 site envelopes</text>
<text class="body" x="62" y="1102">NUMERIC rates; project/workspace history; artifacts and issued snapshot payloads</text>
<text class="body" x="62" y="1129">Supabase private evidence bucket: photo bytes; metadata and SHA-256 remain in app DB</text>
<rect x="1160" y="155" width="360" height="165" rx="14" fill="#edf3fa" stroke="#c9d8d2"/>
<text class="head" x="1182" y="185">Public map providers</text>
<text class="body" x="1182" y="217">OpenFreeMap style / tiles</text>
<text class="body" x="1182" y="244">Photon explicit place search</text>
<text class="body" x="1182" y="271">Direct browser HTTPS requests</text>
<polyline points="1090,210 1160,210" fill="none" stroke="#24705e" stroke-width="2.4" marker-end="url(#arrow)"/>
<text class="small" x="1119" y="198">A</text>
<rect x="1160" y="385" width="360" height="210" rx="14" fill="#edf3fa" stroke="#c9d8d2"/>
<text class="head" x="1182" y="415">Local Supabase Auth</text>
<text class="body" x="1182" y="447">Browser login / refresh / recovery</text>
<text class="body" x="1182" y="474">API fetches trusted JWKS</text>
<text class="body" x="1182" y="501">Current verified-email lookup</text>
<text class="body" x="1182" y="528">Own internal identity database</text>
<polyline points="1090,280 1124,280 1124,420 1160,420" fill="none" stroke="#24705e" stroke-width="2.4" marker-end="url(#arrow)"/>
<text class="small" x="1101" y="273">B</text>
<polyline points="1090,475 1160,475" fill="none" stroke="#24705e" stroke-width="2.4" marker-end="url(#arrow)"/>
<text class="small" x="1119" y="463">C</text>
<rect x="1160" y="635" width="360" height="260" rx="14" fill="#edf3fa" stroke="#c9d8d2"/>
<text class="head" x="1182" y="665">Cross-cutting controls</text>
<text class="body" x="1182" y="697">Tenant and project isolation</text>
<text class="body" x="1182" y="724">No implicit admin bypass</text>
<text class="body" x="1182" y="751">Server-only Storage secret</text>
<text class="body" x="1182" y="778">Stale / partial / unavailable states</text>
<text class="body" x="1182" y="805">Audit events and request IDs</text>
<text class="body" x="1182" y="832">Tests, locks and migrations</text>
<rect x="1160" y="980" width="360" height="180" rx="14" fill="#fff3e4" stroke="#c9d8d2"/>
<text class="head" x="1182" y="1010">Outside current runtime</text>
<text class="body" x="1182" y="1042">Cross-organisation exchange</text>
<text class="body" x="1182" y="1069">Inbox / scoring / formal approvals</text>
<text class="body" x="1182" y="1096">Queue workers and live weather</text>
<text class="body" x="1182" y="1123">Gated BIM / AI / terrain features</text>
<text class="small" x="40" y="1205">Arrows show request / call direction; responses return on the same connection. A: map data. B: identity. C: server trust lookup.</text>
<text class="small" x="40" y="1235">Layering is a responsibility map, not five deployed services: workflow modules currently also contain ORM and adapter calls.</text>
</svg>