[project]
name = "infrashader-api"
version = "0.1.0"
description = "InfraShader organisation-scoped application API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "pyjwt[crypto]>=2.10,<3",
  "tzdata>=2025.1",
  "shapely>=2.1,<3",
  "pyproj>=3.7,<4",
  "pvlib>=0.16.1",
  "httpx>=0.28.1",
  "python-multipart>=0.0.32",
  "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "httpx>=0.28,<1",
    "ruff>=0.9,<1",
    "pypdf>=6.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a disposable PostGIS TEST_DATABASE_URL"]
