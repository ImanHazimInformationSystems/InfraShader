# Local Auth/Storage. Application PostGIS remains at 127.0.0.1:54322.
# Requires Docker; no hosted project is linked.
project_id = "InfraShader"
[api]
enabled = true
port = 54331
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false
[db]
port = 54332
shadow_port = 54330
major_version = 17
[db.seed]
enabled = false
[studio]
enabled = true
port = 54333
api_url = "http://127.0.0.1"
[local_smtp]
enabled = true
port = 54334
[storage]
enabled = true
file_size_limit = "10MiB"
[storage.buckets.evidence]
public = false
file_size_limit = "10MiB"
allowed_mime_types = ["image/png", "image/jpeg"]
[storage.vector]
enabled = false
[storage.analytics]
enabled = false
[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://localhost:5173/"]
jwt_expiry = 3600
signing_keys_path = "./signing_keys.json"
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 8
[auth.email]
enable_signup = false
enable_confirmations = true
secure_password_change = true
[realtime]
enabled = false
[edge_runtime]
enabled = false
[analytics]
enabled = false
